    // Web Audio 音效產生器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playOptionSound() {
      playTone(523.25, 'triangle', 0.05); // C5
    }

    function playPassFanfare() {
      playTone(523.25, 'sine', 0.1); // C5
      setTimeout(() => playTone(659.25, 'sine', 0.1), 100); // E5

      {

        question: "教室裡的木製課桌椅、家裡的木質地板，以及傳統的木屋建築，大多是砍伐後經過加工乾燥的木材製成。這些木材取自植物的哪一部分？",
        options: [

      {

      {

        ],
        answer: "A",
        explain: "【單元綜合省思】植物從氧氣供應、食物來源、建材日用品到綠化醫療，全面支持著人類與地球生態系運作，我們應該愛護校園與大自然中的所有植物。"

    let userAnswers = {};
    let isSubmitted = false;

    // 渲染 16 道題目
    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = "";

      let currentTheme = "";

      quizData.forEach((item, index) => {
        // 主題分組標題
        if (item.themeName !== currentTheme) {
          currentTheme = item.themeName;
          const sectionHeader = document.createElement('div');
          sectionHeader.id = item.themeId;
          sectionHeader.className = "pt-5 pb-1";
          sectionHeader.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="w-3.5 h-6 bg-emerald-600 rounded-full inline-block"></span>
              <h2 class="text-lg sm:text-xl font-black text-slate-900">
                學習主題：${item.themeName}（共 4 題）
              </h2>
            </div>
          `;
          container.appendChild(sectionHeader);
        }

        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl p-5 sm:p-7 shadow-sm border-2 border-emerald-100/90 transition duration-200 hover:shadow-md";
        card.id = `card-q-${item.id}`;

        let optionsHtml = item.options.map(opt => `
          <label class="option-label flex items-start gap-3 p-3.5 sm:p-4 rounded-2xl border-2 border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/40 cursor-pointer transition select-none tap-effect" id="opt-${item.id}-${opt.key}">
            <input type="radio" name="q-${item.id}" value="${opt.key}" onchange="selectOption(${item.id}, '${opt.key}')" class="mt-1 w-4 h-4 text-emerald-600 focus:ring-emerald-500 cursor-pointer">
            <span class="text-sm sm:text-base font-semibold text-slate-700 leading-relaxed">${opt.text}</span>
          </label>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-black px-2.5 py-1 bg-emerald-600 text-white rounded-full">第 ${index + 1} / 16 題</span>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${item.themeTagColor}">
                ${item.themeName}
              </span>
            </div>
            <span id="badge-q-${item.id}" class="text-xs font-bold text-slate-400">尚未填答</span>
          </div>

          <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-4 leading-relaxed">${item.question}</h3>

          <div class="space-y-2.5 flex flex-col">
            ${optionsHtml}
          </div>

          <!-- 解析區塊（交卷後展示） -->
          <div id="explain-${item.id}" class="mt-4 p-4 rounded-2xl hidden text-xs sm:text-sm leading-relaxed border"></div>
        `;

        container.appendChild(card);
      });

      updateProgress();
    }

    // 選擇答案
    function selectOption(qId, key) {
      if (isSubmitted) return;
      playOptionSound();

      userAnswers[qId] = key;

      // 標註已作答
      const badge = document.getElementById(`badge-q-${qId}`);
      if (badge) {
        badge.textContent = "已作答 ✔";
        badge.className = "text-xs font-bold text-emerald-600";
      }

      // 高亮當前題目選取樣式
      const options = document.querySelectorAll(`[id^="opt-${qId}-"]`);
      options.forEach(opt => {
        opt.classList.remove('border-emerald-500', 'bg-emerald-50', 'ring-2', 'ring-emerald-200');
        opt.classList.add('border-slate-200');
      });
      const selected = document.getElementById(`opt-${qId}-${key}`);
      if (selected) {
        selected.classList.remove('border-slate-200');
        selected.classList.add('border-emerald-500', 'bg-emerald-50', 'ring-2', 'ring-emerald-200');
      }

      updateProgress();
    }

    // 更新進度條
    function updateProgress() {
      const count = Object.keys(userAnswers).length;
      document.getElementById('answeredCount').textContent = count;
      const percent = (count / quizData.length) * 100;
      document.getElementById('progressBar').style.width = `${percent}%`;

      const hint = document.getElementById('statusHint');
      if (count === quizData.length) {
        hint.textContent = "太棒了！16 題已全數填答完畢，隨時可以結算交卷 🍎";
        hint.className = "text-xs sm:text-sm font-bold text-emerald-600 animate-pulse";
      } else {
        hint.textContent = `已完成 ${count} 題，還有 ${quizData.length - count} 題尚未填答`;
        hint.className = "text-xs sm:text-sm font-bold text-amber-600";
      }
    }

    // 提交測驗與計算成績
    function calculateScore() {
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < quizData.length) {
        const confirmSubmit = window.confirm(`親愛的小朋友，你還有 ${quizData.length - answeredCount} 題尚未作答，確定要現在結算交卷嗎？`);
        if (!confirmSubmit) return;
      }

      isSubmitted = true;
      let correctCount = 0;

      quizData.forEach(item => {
        const userChoice = userAnswers[item.id];
        const isCorrect = userChoice === item.answer;
        if (isCorrect) correctCount++;

        const expBox = document.getElementById(`explain-${item.id}`);
        expBox.classList.remove('hidden');

        if (isCorrect) {
          expBox.classList.add('bg-emerald-50', 'text-emerald-950', 'border-emerald-200');
          expBox.innerHTML = `
            <div class="font-extrabold text-emerald-700 flex items-center gap-1.5 mb-1">
              <span>✅ 答對了！ 正確答案是（${item.answer}）</span>
            </div>
            <div class="text-slate-700 font-medium">${item.explain}</div>
          `;
        } else {
          expBox.classList.add('bg-rose-50', 'text-rose-950', 'border-rose-200');
          expBox.innerHTML = `
            <div class="font-extrabold text-rose-700 flex items-center gap-1.5 mb-1">
              <span>❌ 答錯囉！ 你的選擇是（${userChoice || "未填"}），正確答案應該是（${item.answer}）</span>
            </div>
            <div class="text-slate-700 font-medium">${item.explain}</div>
          `;
        }

        // 標記選項
        item.options.forEach(opt => {
          const optElem = document.getElementById(`opt-${item.id}-${opt.key}`);
          const inputRadio = optElem.querySelector('input');
          inputRadio.disabled = true;

          if (opt.key === item.answer) {
            optElem.classList.remove('border-slate-200', 'bg-emerald-50');
            optElem.classList.add('border-emerald-500', 'bg-emerald-100', 'font-bold');
          } else if (opt.key === userChoice && !isCorrect) {
            optElem.classList.remove('border-slate-200');
            optElem.classList.add('border-rose-400', 'bg-rose-100', 'text-rose-800');
          }
        });
      });

      // 禁用交卷鈕
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
      submitBtn.classList.add('bg-slate-400', 'cursor-not-allowed');
      submitBtn.innerHTML = "<span>🎉 測驗完成，已在下方列出 16 題詳細生活科學解析</span>";

      if (correctCount >= 12) {
        playPassFanfare();
      } else {
        playEncourageSound();
      }

      showResultModal(correctCount);
    }

    // 彈出評語與成績視窗
    function showResultModal(score) {
      const modal = document.getElementById('resultModal');
      const scoreText = document.getElementById('scoreText');
      const rateText = document.getElementById('accuracyRate');
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const feedback = document.getElementById('feedbackText');

      scoreText.textContent = score;
      const percent = Math.round((score / quizData.length) * 100);
      rateText.textContent = `正確率：${percent}%`;

      if (score >= 15) {
        icon.textContent = "🏆";
        title.textContent = "生態綠能小院士！滿分榮耀！";
        feedback.textContent = `太神了！你答對了 ${score} 題！你清楚明白植物如何扮演生產者製造氧氣養分、保護水土，還能神準分辨我們每天吃的根莖葉花果種，連木材建材與行道樹綠美化都難不倒你！你是當之無愧的大自然科學博士！🌳👑`;
      } else if (score >= 12) {
        icon.textContent = "🌟";
        title.textContent = "植物生活達人！表現非常優秀！";
        feedback.textContent = `太棒了！你答對了 ${score} 題。你對植物與日常生活的緊密連結掌握得非常扎實！只有幾題特殊的食用器官（例如洋蔥是鱗莖、馬鈴薯是塊莖）需要稍微釐清。點擊下方按鈕閱讀解析，你很快就能拿下 16 題滿分！🥦✨`;
      } else if (score >= 8) {
        icon.textContent = "🌿";
        title.textContent = "綠色探索家！繼續加油！";
        feedback.textContent = `你答對了 ${score} 題，已經掌握了一半以上的重要觀念！植物在大自然扮演生產者，而餐桌上的食材則是植物的不同器官。建議多複習「根、莖、葉與果實種子的分辨」，看完詳細解析後再測驗一次，肯定大幅進步！🌱💪`;
      } else {
        icon.textContent = "🌱";
        title.textContent = "大自然小萌芽，再接再厲！";
        feedback.textContent = `這次答對了 ${score} 題，別灰心！自然科學和我們的餐桌生活息息相關。老師在每一題底下都寫了詳細淺顯的課堂重點解析，花 3 分鐘仔細看一遍，再點擊「重新挑戰一次」，你的科學實力一定會像大樹一樣茁壯成長！🌾📖`;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // 關閉彈窗並檢視解析
    function closeModalAndReview() {
      const modal = document.getElementById('resultModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      window.scrollTo({ top: 380, behavior: 'smooth' });
    }

    // 重新測驗重置
    function resetQuiz() {
      userAnswers = {};
      isSubmitted = false;

      const modal = document.getElementById('resultModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = false;
      submitBtn.className = "w-full sm:w-2/3 py-4 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white text-lg font-black rounded-2xl shadow-lg hover:shadow-emerald-400/40 transition duration-200 flex items-center justify-center gap-2 cursor-pointer tap-effect";
      submitBtn.innerHTML = "<span>📝 完成測驗，立即批改 16 題！</span>";

      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = function() {
      renderQuiz();
    };
  </script>
